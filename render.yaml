services:
  - type: web
    name: physmentor-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: '["gemini-3.6-flash"]'
      - key: ALLOWED_ORIGINS
        value: '*'
      - key: PYTHON_VERSION
        value: 3.11.9
